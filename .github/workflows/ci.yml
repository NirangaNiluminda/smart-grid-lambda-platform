name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install workspace
        run: |
          python -m pip install -U pip
          pip install -e "libs/common[dev]"
          for svc in services/*; do
            pip install -e "$svc[dev]"
          done

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type-check
        run: mypy libs/common/src services/*/src

      - name: Unit tests
        run: pytest -m "not integration" --cov=energy_common --cov-report=term-missing
