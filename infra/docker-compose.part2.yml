# Part 2 overlay — added on top of infra/docker-compose.yml.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.part2.yml up -d --build
#   (or: make up-full)

name: smart-grid

services:
  # Env-only override of the Part 1 service: once Airflow is part of the stack,
  # batch-file-generator tells it to run the batch layer for the day that just
  # closed (adapters/airflow_trigger.py). A no-op with Part 1 alone (`make up`).
  batch-file-generator:
    environment:
      AIRFLOW_TRIGGER_ENABLED: "true"
      AIRFLOW_BASE_URL: http://airflow:8080
      AIRFLOW_DAG_ID: daily_energy_reconciliation
      AIRFLOW_USERNAME: admin
      AIRFLOW_PASSWORD: admin

  stream-processor:
    build:
      context: ..
      dockerfile: services/stream-processor/Dockerfile
    container_name: sg-stream-processor
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PG_DSN: postgresql://energy:energy@postgres:5432/energy_serving
      LAKE_ROOT: /data/lake
      LOG_FORMAT: ${LOG_FORMAT:-json}
    ports: ["9111:9111"]
    volumes:
      - ../data:/data
    restart: on-failure

  batch-processor:
    build:
      context: ..
      dockerfile: services/batch-processor/Dockerfile
    container_name: sg-batch-processor
    profiles: ["manual"]   # invoked by Airflow / on demand, not a long-running service
    environment:
      PG_DSN: postgresql://energy:energy@postgres:5432/energy_serving
      LAKE_ROOT: /data/lake
      LANDING_ROOT: /data/landing
    volumes:
      - ../data:/data
      - ../reports:/app/reports

  serving-api:
    build:
      context: ..
      dockerfile: services/serving-api/Dockerfile
    container_name: sg-serving-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://serving_ro:serving_ro@postgres:5432/energy_serving
      API_PORT: 8000
    ports: ["8000:8000"]
    restart: on-failure

  alert-engine:
    build:
      context: ..
      dockerfile: services/alert-engine/Dockerfile
    container_name: sg-alert-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://energy:energy@postgres:5432/energy_serving
      PROMETHEUS_URL: http://prometheus:9090
      ALERT_NO_DATA_MINUTES: ${ALERT_NO_DATA_MINUTES:-3}
      ALERT_LOW_RENEWABLE_PCT: ${ALERT_LOW_RENEWABLE_PCT:-15}
      ALERT_MAX_REJECT_RATE: ${ALERT_MAX_REJECT_RATE:-0.05}
    ports: ["9114:9114"]
    restart: on-failure

  airflow:
    build:
      context: ..
      dockerfile: orchestration/airflow/Dockerfile
    container_name: sg-airflow
    # The image's default non-root `airflow` user (uid 50000) can't write to
    # bind-mounted host directories whose filesystem doesn't honour per-file
    # ownership for non-root uids (e.g. a fuseblk/NTFS-3G mount) -- reports/
    # writes fail with a plain PermissionError. Running as root is the
    # standard fix Airflow's own docs give for bind-mount uid mismatches.
    user: "0:0"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://energy:energy@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      # The REST API is how batch-file-generator triggers a run (basic auth);
      # the webserver's own login keeps session auth on top of that.
      # NOTE: with this image's auth manager (AIRFLOW__CORE__AUTH_MANAGER =
      # FabAuthManager, the 2.10.x default), the classic [api] auth_backends
      # setting is NOT what the REST API checks -- it's authenticated fine but
      # every request gets a 403 regardless of role/permissions. The FAB
      # provider moved this to [fab] auth_backends with its own module paths;
      # see https://airflow.apache.org/docs/apache-airflow-providers-fab/stable/auth-manager/api-authentication.html
      AIRFLOW__FAB__AUTH_BACKENDS: airflow.providers.fab.auth_manager.api.auth.backend.basic_auth,airflow.providers.fab.auth_manager.api.auth.backend.session
      # daily_energy_reconciliation is triggered externally (schedule=None);
      # this only controls the DAG's own required-but-unused start_date.
      AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
      PG_DSN: postgresql://energy:energy@postgres:5432/energy_serving
      LAKE_ROOT: /data/lake
      LANDING_ROOT: /data/landing
    ports: ["8080:8080"]
    volumes:
      - ../orchestration/airflow/dags:/opt/airflow/dags:ro
      - ../data:/data
      - ../reports:/opt/airflow/reports
    # webserver + scheduler in one container is fine at this scale;
    # production would split these into separate, independently-scaled
    # services.
    #
    # NOT `standalone`: it bootstraps its own admin user with a fresh
    # random password every start (ignoring _AIRFLOW_WWW_USER_USERNAME/
    # PASSWORD) *and*, more fundamentally, forces the API onto session-only
    # auth at runtime regardless of AIRFLOW__API__AUTH_BACKENDS -- basic auth
    # (what AirflowDagTrigger uses) gets a 403 unconditionally under
    # `standalone`. Plain `webserver`/`scheduler` respect the configured auth
    # backends normally.
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        airflow db migrate
        # Delete-then-create, not create-if-missing: the `pg-data` volume
        # persists across restarts, so a plain `create` silently no-ops
        # against whatever admin user (and whatever password) already exists
        # from an earlier start -- e.g. `standalone`'s random-password
        # bootstrap the very first time this project's compose stack ran.
        # This guarantees admin/admin every time, matching the docs.
        airflow users delete --username admin >/dev/null 2>&1 || true
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com
        airflow scheduler &
        exec airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  grafana:
    image: grafana/grafana:11.2.0
    container_name: sg-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
