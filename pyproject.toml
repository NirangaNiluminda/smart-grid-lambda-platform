# Workspace-level configuration for shared developer tooling.
# Each service and library carries its own pyproject.toml with its runtime
# dependencies; this file only configures lint / type-check / test behaviour
# so every package in the monorepo is checked the same way.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["orchestration/airflow/logs", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["B008"]  # FastAPI dependency-injection idiom

[tool.ruff.lint.isort]
# energy_common is a pip-installed shared package -> group it with third-party.
# Each service's own package is auto-detected as first-party.
known-third-party = ["energy_common"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["E501"]  # test data / assertions read better unwrapped

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
# 3.12 here only controls which typeshed/stub syntax mypy parses (needed for
# numpy's stubs, pulled in transitively via pyspark) -- the project itself
# still targets/requires >=3.11 (see each package's pyproject.toml) and uses
# no 3.12-only runtime features.
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "build/"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pyarrow.*", "prometheus_client.*", "pyspark.*", "httpx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy's stubs (pulled in transitively via pyspark's pandas-on-Spark module)
# use PEP 695 syntax that only parses under python_version >= 3.12. Nothing in
# this project imports numpy directly; suppress errors from its stub file
# rather than bumping the project's target version for an unused dependency.
module = "numpy.*"
ignore_missing_imports = true
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --import-mode=importlib"
testpaths = ["libs", "services", "orchestration", "tests"]
markers = [
    "integration: tests that need live infrastructure (Kafka, Postgres); excluded from the default unit run",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:anyio.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    # py4j's gateway sockets get garbage-collected off the main thread; the
    # resulting ResourceWarning is pyspark/py4j internals, not project code.
    "ignore::ResourceWarning",
]
