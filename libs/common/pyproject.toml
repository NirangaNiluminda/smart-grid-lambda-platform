[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "energy-common"
version = "1.0.0"
description = "Shared kernel for the Smart Grid data platform: domain models, ports, config, observability, sim-clock, adapters."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# Infrastructure adapters — services that touch Kafka/Postgres/Parquet pull these in.
kafka = ["confluent-kafka>=2.4"]
postgres = ["SQLAlchemy>=2.0", "psycopg[binary]>=3.1"]
parquet = ["pyarrow>=16.0"]
dev = [
    "energy-common[kafka,postgres,parquet]",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "black>=24.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/energy_common"]
