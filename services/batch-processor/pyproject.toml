[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "batch-processor"
version = "0.1.0"
description = "Lambda batch layer: Spark batch job reading the Parquet master dataset for daily billing + solar reconciliation."
requires-python = ">=3.11"
# Parquet is read via Spark's own reader (pyspark bundles it) -- the
# energy-common 'parquet' extra (pyarrow) is ingestion's concern, not ours.
dependencies = [
    "energy-common[postgres]>=1.0",
    "pyspark>=3.5,<3.6",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
batch-processor = "batch_processor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batch_processor"]
