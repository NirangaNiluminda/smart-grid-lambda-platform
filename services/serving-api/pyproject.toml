[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "serving-api"
version = "0.1.0"
description = "Lambda serving layer: read-only FastAPI over Postgres, merging speed + batch views. [Part 2 skeleton]"
requires-python = ">=3.11"
dependencies = [
    "energy-common[postgres]>=1.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
serving-api = "serving_api.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/serving_api"]
