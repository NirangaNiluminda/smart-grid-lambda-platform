[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alert-engine"
version = "0.1.0"
description = "Observability: evaluates health/threshold alert rules over Postgres + Prometheus. [Part 2 skeleton]"
requires-python = ">=3.11"
dependencies = [
    "energy-common[postgres]>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
alert-engine = "alert_engine.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/alert_engine"]
