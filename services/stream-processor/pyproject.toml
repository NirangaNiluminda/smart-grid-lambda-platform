[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stream-processor"
version = "0.1.0"
description = "Lambda speed layer: Spark Structured Streaming meter.readings -> rt_zone_metrics. [Part 2 skeleton]"
requires-python = ">=3.11"
dependencies = [
    "energy-common[kafka,postgres]>=1.0",
    "pyspark>=3.5,<3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
stream-processor = "stream_processor.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stream_processor"]
